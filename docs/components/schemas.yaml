schemas:
  Error:
    type: object
    properties:
      status:
        type: string
        example: error
      message:
        type: string
        example: Something went wrong

  User:
    type: object
    properties:
      id:
        type: integer
      firstName:
        type: string
      lastName:
        type: string
      email:
        type: string
        format: email
      status:
        type: string
        enum: [ACTIVE, BLOCKED, SUSPENDED, INCOMPLETE]
      roles:
        type: array
        items:
          type: string
      createdAt:
        type: string
        format: date-time

  Campaign:
    type: object
    properties:
      id:
        type: integer
      userId:
        type: integer
      campaignName:
        type: string
      userDescription:
        type: string
      goalType:
        type: string
        enum: [awareness, consideration, conversion, lead_generation, retention]
      totalBudget:
        type: number
        format: decimal
      currency:
        type: string
      lifecycleStage:
        type: string
        enum: [draft, ai_generated, active, completed]
      startDate:
        type: string
        format: date-time
      endDate:
        type: string
        format: date-time
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  Collaboration:
    type: object
    properties:
      id:
        type: integer
      campaignId:
        type: integer
      influencerId:
        type: integer
      ownerId:
        type: integer
      status:
        type: string
        enum: [pending, active, completed, cancelled]
      startDate:
        type: string
        format: date-time
      endDate:
        type: string
        format: date-time

  CollaborationRequest:
    type: object
    properties:
      id:
        type: integer
      senderId:
        type: integer
      receiverId:
        type: integer
      campaignId:
        type: integer
      proposedBudget:
        type: number
        format: decimal
      message:
        type: string
      status:
        type: string
        enum: [pending, accepted, rejected]

  InfluencerProfile:
    type: object
    properties:
      id:
        type: integer
      userId:
        type: integer
      bio:
        type: string
      image:
        type: string
      location:
        type: string
      socialMediaLinks:
        type: object
      primaryPlatform:
        type: string
      followersCount:
        type: integer
      engagementRate:
        type: number
      categories:
        type: array
        items:
          type: string
      contentTypes:
        type: array
        items:
          type: string
      collaborationTypes:
        type: array
        items:
          type: string
      audienceAgeRange:
        type: string
      audienceGender:
        type: string
      audienceLocation:
        type: string
      interests:
        type: array
        items:
          type: string
      completionPercentage:
        type: integer
      isOnboarded:
        type: boolean

  OwnerProfile:
    type: object
    properties:
      id:
        type: integer
      userId:
        type: integer
      businessName:
        type: string
      businessType:
        type: string
      industry:
        type: string
      location:
        type: string
      description:
        type: string
      image:
        type: string
      website:
        type: string
      phoneNumber:
        type: string
      platformsUsed:
        type: array
        items:
          type: string
      primaryMarketingGoal:
        type: string
      targetAudience:
        type: object
      completionPercentage:
        type: integer
      isOnboarded:
        type: boolean

  ServiceListing:
    type: object
    properties:
      id:
        type: integer
      influencerId:
        type: integer
      title:
        type: string
      description:
        type: string
      category:
        type: string
      price:
        type: number
        format: decimal
      deliveryTime:
        type: integer
        description: Delivery time in days
      platforms:
        type: array
        items:
          type: string
      tags:
        type: array
        items:
          type: string
      status:
        type: string
        enum: [draft, published, archived]
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  Offer:
    type: object
    properties:
      id:
        type: integer
      serviceListingId:
        type: integer
      ownerId:
        type: integer
      influencerId:
        type: integer
      campaignId:
        type: integer
        nullable: true
      amount:
        type: number
        format: decimal
      counterAmount:
        type: number
        format: decimal
        nullable: true
      message:
        type: string
      status:
        type: string
        enum: [pending, accepted, rejected, countered, withdrawn]
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time

  Pagination:
    type: object
    properties:
      total:
        type: integer
        description: Total number of items
        example: 100
      page:
        type: integer
        description: Current page number
        example: 1
      limit:
        type: integer
        description: Items per page
        example: 10
      totalPages:
        type: integer
        description: Total number of pages
        example: 10

  ChatRoom:
    type: object
    properties:
      id:
        type: integer
        example: 1
      name:
        type: string
        nullable: true
        example: "Campaign Collaboration Chat"
      collaborationId:
        type: integer
        nullable: true
        description: ID of the collaboration this chat room belongs to
        example: 5
      createdAt:
        type: string
        format: date-time
        example: "2026-03-01T10:00:00Z"
      updatedAt:
        type: string
        format: date-time
        example: "2026-03-06T14:30:00Z"
      participants:
        type: array
        items:
          $ref: '#/schemas/ChatParticipant'
      collaboration:
        $ref: '#/schemas/Collaboration'

  ChatParticipant:
    type: object
    properties:
      id:
        type: integer
        example: 1
      chatRoomId:
        type: integer
        example: 1
      userId:
        type: integer
        example: 10
      joinedAt:
        type: string
        format: date-time
        example: "2026-03-01T10:00:00Z"
      lastReadAt:
        type: string
        format: date-time
        nullable: true
        example: "2026-03-06T14:25:00Z"
      user:
        type: object
        properties:
          id:
            type: integer
            example: 10
          firstName:
            type: string
            example: "John"
          lastName:
            type: string
            example: "Doe"
          email:
            type: string
            format: email
            example: "john.doe@example.com"

  Message:
    type: object
    properties:
      id:
        type: integer
        example: 42
      chatRoomId:
        type: integer
        example: 1
      senderId:
        type: integer
        example: 10
      content:
        type: string
        example: "Hello! Looking forward to our collaboration."
      replyToId:
        type: integer
        nullable: true
        description: ID of the message being replied to
        example: 40
      deliveryStatus:
        type: string
        enum: [sent, delivered, read]
        default: sent
        example: read
      editedAt:
        type: string
        format: date-time
        nullable: true
        description: Timestamp when the message was last edited
        example: "2026-03-06T14:35:00Z"
      deletedAt:
        type: string
        format: date-time
        nullable: true
        description: Timestamp when the message was soft deleted
        example: null
      createdAt:
        type: string
        format: date-time
        example: "2026-03-06T14:30:00Z"
      updatedAt:
        type: string
        format: date-time
        example: "2026-03-06T14:35:00Z"
      sender:
        type: object
        properties:
          id:
            type: integer
            example: 10
          firstName:
            type: string
            example: "John"
          lastName:
            type: string
            example: "Doe"
          email:
            type: string
            format: email
            example: "john.doe@example.com"
      replyTo:
        nullable: true
        allOf:
          - $ref: '#/schemas/Message'
        description: The message being replied to (if any)

  Notification:
    type: object
    properties:
      id:
        type: integer
        example: 1
      userId:
        type: integer
        example: 10
      message:
        type: string
        example: "Your campaign has been approved"
      type:
        type: string
        enum: [info, warning, error, success]
        example: success
      category:
        type: string
        enum: [collaboration, task, offer, campaign, message, system]
        nullable: true
        example: campaign
      isRead:
        type: boolean
        default: false
        example: false
      actionUrl:
        type: string
        nullable: true
        description: URL to navigate to when notification is clicked
        example: "/campaigns/123"
      imageUrl:
        type: string
        nullable: true
        description: Optional image URL for the notification
        example: "https://example.com/images/campaign.jpg"
      expiresAt:
        type: string
        format: date-time
        nullable: true
        description: Optional expiration date for time-sensitive notifications
        example: "2026-03-13T10:00:00Z"
      createdAt:
        type: string
        format: date-time
        example: "2026-03-06T14:30:00Z"
      updatedAt:
        type: string
        format: date-time
        example: "2026-03-06T14:30:00Z"

