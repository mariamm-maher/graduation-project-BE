openapi: 3.0.0

info:
  title: Node.js Backend API
  description: |
    API Documentation for the Campaign Management & Collaboration Platform
    ## Authentication
    Most endpoints require JWT authentication via Bearer token.
    ## Rate Limiting
    API calls are rate-limited to prevent abuse.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:5000
    description: Local Development Server
  - url: https://api-staging.example.com
    description: Staging Server
  - url: https://api.example.com
    description: Production Server

tags:
  - name: Auth
    description: Authentication and Session Management
  - name: Campaigns
    description: Campaign Management
  - name: Collaboration Requests
    description: Requests & Negotiation
  - name: Collaborations
    description: Core Collaborations
  - name: Collaboration Contracts
    description: Collaboration Contracts
  - name: Collaboration Tasks
    description: Collaboration Tasks Management
  - name: Owners
    description: Owner Profile and Operations
  - name: Influencer
    description: Influencer Profile and Dashboard Operations
  - name: Social Media
    description: Social Media Integrations
  - name: Chat
    description: Real-time Chat and Messaging (REST API + WebSocket)
  - name: Admin
    description: Administrative Operations (Admin Only)
  - name: Notifications
    description: User Notifications Management
  - name: Upload
    description: File Upload and Management
  - name: Profile
    description: User Profile Management (Owner & Influencer)

