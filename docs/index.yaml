  /api/admin/collaboration-requests/{id}/status:
    $ref: './paths/admin.yaml#/paths/~1api~1admin~1collaboration-requests~1{id}~1status'

  /api/admin/campaigns:
    $ref: './paths/admin.yaml#/paths/~1api~1admin~1campaigns'

  /api/admin/campaigns/{id}:
