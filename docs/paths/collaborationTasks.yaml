paths:
 

  /api/collaboration-tasks/collaboration/{collaborationId}:
    get:
      tags:
        - Collaboration Tasks
      summary: Get tasks for a collaboration
      description: Retrieve all tasks (board view) for a specific collaboration
      security:
        - bearerAuth: []
      parameters:
        - name: collaborationId
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
        - name: status
          in: query
          required: false
          description: Filter tasks by status
          schema:
            type: string
            enum: [todo, in_progress, in_review, completed]
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Tasks retrieved successfully
                  data:
                    type: object
                    properties:
                      tasks:
                        type: array
                        items:
                          type: object
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaboration-tasks/{id}:
    get:
      tags:
        - Collaboration Tasks
      summary: Get task by ID
      description: Retrieve details of a specific collaboration task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Task retrieved successfully
                  data:
                    type: object
                    properties:
                      task:
                        type: object
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

    patch:
      tags:
        - Collaboration Tasks
      summary: Update a task
      description: Update task details such as title, description, or due date
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Create Instagram post"
                description:
                  type: string
                  example: "Design and publish Instagram post about product launch"
                dueDate:
                  type: string
                  format: date
                  example: "2026-04-15"
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Task updated successfully
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaboration-tasks/{id}/start:
    patch:
      tags:
        - Collaboration Tasks
      summary: Mark task as started
      description: Move task to in-progress status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Task started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Task started successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaboration-tasks/{id}/submit:
    patch:
      tags:
        - Collaboration Tasks
      summary: Submit task for review
      description: Submit completed task for owner review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                submissionNote:
                  type: string
                  example: "Task completed as requested"
                attachments:
                  type: array
                  items:
                    type: string
                  example: ["https://example.com/file1.jpg"]
      responses:
        '200':
          description: Task submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Task submitted successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaboration-tasks/{id}/approve:
    patch:
      tags:
        - Collaboration Tasks
      summary: Approve a task
      description: Owner approves the submitted task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback:
                  type: string
                  example: "Great work! Approved."
      responses:
        '200':
          description: Task approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Task approved successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaboration-tasks/{id}/reject:
    patch:
      tags:
        - Collaboration Tasks
      summary: Reject a task
      description: Owner rejects the submitted task and requests revisions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - feedback
              properties:
                feedback:
                  type: string
                  example: "Please revise the color scheme"
      responses:
        '200':
          description: Task rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Task rejected for revisions
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaboration-tasks/{id}/reject-final:
    patch:
      tags:
        - Collaboration Tasks
      summary: Terminal reject a task
      description: Finally reject the task without option for revision
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: "Does not meet requirements"
      responses:
        '200':
          description: Task finally rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Task finally rejected
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'



