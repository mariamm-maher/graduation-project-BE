paths:
  /api/service-listings/browse:
    get:
      tags:
        - Service Listings
      summary: Browse published service listings
      description: Publicly browse all published service listings from influencers
      parameters:
        - $ref: '../components/parameters.yaml#/parameters/PageNumber'
        - $ref: '../components/parameters.yaml#/parameters/PageSize'
        - name: category
          in: query
          required: false
          description: Filter by category
          schema:
            type: string
            example: "social-media-management"
        - name: minPrice
          in: query
          required: false
          description: Minimum price filter
          schema:
            type: number
            example: 100
        - name: maxPrice
          in: query
          required: false
          description: Maximum price filter
          schema:
            type: number
            example: 5000
      responses:
        '200':
          description: Service listings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Service listings retrieved successfully
                  data:
                    type: object
                    properties:
                      listings:
                        type: array
                        items:
                          $ref: '../components/schemas.yaml#/schemas/ServiceListing'
                      pagination:
                        $ref: '../components/schemas.yaml#/schemas/Pagination'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/service-listings/search:
    get:
      tags:
        - Service Listings
      summary: Search service listings with filters
      description: Search service listings with various filters
      parameters:
        - $ref: '../components/parameters.yaml#/parameters/PageNumber'
        - $ref: '../components/parameters.yaml#/parameters/PageSize'
        - name: query
          in: query
          required: false
          description: Search query string
          schema:
            type: string
            example: "instagram content creation"
        - name: category
          in: query
          required: false
          description: Filter by category
          schema:
            type: string
            example: "content-creation"
        - name: platform
          in: query
          required: false
          description: Filter by social media platform
          schema:
            type: string
            enum: [instagram, tiktok, youtube, facebook, twitter]
            example: instagram
        - name: minPrice
          in: query
          required: false
          description: Minimum price
          schema:
            type: number
            example: 500
        - name: maxPrice
          in: query
          required: false
          description: Maximum price
          schema:
            type: number
            example: 3000
        - name: sortBy
          in: query
          required: false
          description: Sort field
          schema:
            type: string
            enum: [price, createdAt, popularity]
            example: price
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            example: asc
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Search results retrieved successfully
                  data:
                    type: object
                    properties:
                      listings:
                        type: array
                        items:
                          $ref: '../components/schemas.yaml#/schemas/ServiceListing'
                      pagination:
                        $ref: '../components/schemas.yaml#/schemas/Pagination'
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/service-listings/categories:
    get:
      tags:
        - Service Listings
      summary: Get available categories
      description: Returns a list of available service listing categories
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Categories retrieved successfully
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          type: string
                        example: ["content-creation", "social-media-management", "brand-partnerships", "product-reviews"]
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/service-listings:
    post:
      tags:
        - Service Listings
      summary: Create a new service listing (Influencer)
      description: Allows influencers to create a new service listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - category
                - price
              properties:
                title:
                  type: string
                  example: "Instagram Content Creation Package"
                description:
                  type: string
                  example: "Professional Instagram content creation including photos and reels"
                category:
                  type: string
                  example: "content-creation"
                price:
                  type: number
                  example: 1500.00
                deliveryTime:
                  type: integer
                  example: 7
                  description: Delivery time in days
                platforms:
                  type: array
                  items:
                    type: string
                  example: ["instagram", "tiktok"]
                tags:
                  type: array
                  items:
                    type: string
                  example: ["fashion", "lifestyle", "beauty"]
      responses:
        '201':
          description: Service listing created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Service listing created successfully
                  data:
                    type: object
                    properties:
                      listing:
                        $ref: '../components/schemas.yaml#/schemas/ServiceListing'
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/service-listings/my-listings:
    get:
      tags:
        - Service Listings
      summary: Get my service listings (Influencer)
      description: Returns all service listings created by the authenticated influencer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../components/parameters.yaml#/parameters/PageNumber'
        - $ref: '../components/parameters.yaml#/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: Filter by listing status
          schema:
            type: string
            enum: [draft, published, archived]
            example: published
      responses:
        '200':
          description: My listings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: My listings retrieved successfully
                  data:
                    type: object
                    properties:
                      listings:
                        type: array
                        items:
                          $ref: '../components/schemas.yaml#/schemas/ServiceListing'
                      pagination:
                        $ref: '../components/schemas.yaml#/schemas/Pagination'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/service-listings/{id}:
    get:
      tags:
        - Service Listings
      summary: Get service listing by ID
      description: Returns details of a specific service listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service listing ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Service listing retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Service listing retrieved successfully
                  data:
                    type: object
                    properties:
                      listing:
                        $ref: '../components/schemas.yaml#/schemas/ServiceListing'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

    put:
      tags:
        - Service Listings
      summary: Update service listing (Influencer)
      description: Allows influencer to update their service listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service listing ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Updated Instagram Content Creation Package"
                description:
                  type: string
                  example: "Updated description"
                category:
                  type: string
                  example: "content-creation"
                price:
                  type: number
                  example: 1800.00
                deliveryTime:
                  type: integer
                  example: 5
                platforms:
                  type: array
                  items:
                    type: string
                  example: ["instagram"]
                tags:
                  type: array
                  items:
                    type: string
                  example: ["fashion", "lifestyle"]
      responses:
        '200':
          description: Service listing updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Service listing updated successfully
                  data:
                    type: object
                    properties:
                      listing:
                        $ref: '../components/schemas.yaml#/schemas/ServiceListing'
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

    delete:
      tags:
        - Service Listings
      summary: Delete service listing (Influencer)
      description: Allows influencer to delete their service listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service listing ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Service listing deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Service listing deleted successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/service-listings/{id}/status:
    patch:
      tags:
        - Service Listings
      summary: Update service listing status (Influencer)
      description: Allows influencer to update the status of their service listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Service listing ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [draft, published, archived]
                  example: published
      responses:
        '200':
          description: Service listing status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Service listing status updated successfully
                  data:
                    type: object
                    properties:
                      listing:
                        $ref: '../components/schemas.yaml#/schemas/ServiceListing'
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'
