      responses:
        '200':
          description: Influencer collaborations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Influencer collaborations retrieved successfully
                  data:
                    type: object
                    properties:
                      collaborations:
                        type: array
                        items:
                          type: object
                      pagination:
                        $ref: '../components/schemas.yaml#/schemas/Pagination'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/{id}:
    get:
      tags:
        - Collaborations
      summary: Get collaboration by ID
      description: Returns details of a specific collaboration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Collaboration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration retrieved successfully
                  data:
                    type: object
                    properties:
                      collaboration:
                        type: object
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/{id}/cancel:
    patch:
      tags:
        - Collaborations
      summary: Cancel a collaboration
      description: Cancel an active collaboration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Unable to continue due to scheduling conflicts"
      responses:
        '200':
          description: Collaboration cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration cancelled successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/{id}/complete:
    patch:
      tags:
        - Collaborations
      summary: Mark collaboration as complete
      description: Mark a collaboration as complete when all tasks are done
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Collaboration marked as complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration marked as complete
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/{collaborationId}/contract:
    post:
      tags:
        - Collaborations
      summary: Create a contract for a collaboration
      description: Create a contract with terms and conditions for the collaboration
      security:
        - bearerAuth: []
      parameters:
        - name: collaborationId
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - terms
              properties:
                terms:
                  type: string
                  example: "Contract terms and conditions"
                amount:
                  type: number
                  example: 1000.00
                milestones:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      amount:
                        type: number
                      dueDate:
                        type: string
                        format: date
      responses:
        '201':
          description: Contract created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Contract created successfully
                  data:
                    type: object
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

    get:
      tags:
        - Collaborations
      summary: Get contract for a collaboration
      description: Retrieve the contract associated with a collaboration
      security:
        - bearerAuth: []
      parameters:
        - name: collaborationId
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Contract retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Contract retrieved successfully
                  data:
                    type: object
                    properties:
                      contract:
                        type: object
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/contracts/{id}:
