paths:
  /api/collaborations:
    post:
      tags:
        - Collaborations
      summary: Owner sends a collaboration request to an influencer
      description: Create a collaboration request for a campaign and an influencer. Only Owners may perform this action.
      operationId: sendCollaborationRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaignId
                - influencerId
              properties:
                campaignId:
                  type: integer
                  example: 1
                influencerId:
                  type: integer
                  example: 2
                proposedBudget:
                  type: number
                  format: float
                  example: 500.00
                message:
                  type: string
                  example: "I'd like to invite you to this campaign"
      responses:
        '201':
          description: Collaboration request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Collaboration request created
                  data:
                    type: object
                    properties:
                      collaborationRequest:
                        type: object
                        properties:
                          id:
                            type: integer
                          campaignId:
                            type: integer
                          influencerId:
                            type: integer
                          proposedBudget:
                            type: number
                            format: float
                            nullable: true
                          message:
                            type: string
                            nullable: true
                          status:
                            type: string
                          createdAt:
                            type: string
                            format: date-time
        '400':
          $ref: '../components/responses.yaml#/responses/ValidationError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '409':
          description: Conflict - duplicate pending request
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/schemas/Error'
              example:
                status: error
                message: A pending request already exists for this influencer and campaign

  /api/collaborations/requests:
    post:
      tags:
        - Collaborations
      summary: Owner sends a collaboration request to an influencer
      description: Create a collaboration request for a campaign and an influencer. Only Owners may perform this action.
      operationId: inviteCollaborationRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaignId
                - influencerId
              properties:
                campaignId:
                  type: integer
                  example: 1
                influencerId:
                  type: integer
                  example: 2
                proposedBudget:
                  type: number
                  format: float
                  example: 500.00
                message:
                  type: string
                  example: "I'd like to invite you to this campaign"
      responses:
        '201':
          description: Collaboration request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration request created
                  data:
                    type: object
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

    get:
      tags:
        - Collaborations
      summary: List collaboration requests for a campaign
      description: Owner sees requests for a specific campaign with optional status filter
      security:
        - bearerAuth: []
      parameters:
        - name: campaignId
          in: query
          required: false
          description: Campaign ID to filter by
          schema:
            type: integer
            example: 1
        - name: status
          in: query
          required: false
          description: Filter by request status
          schema:
            type: string
            enum: [pending, accepted, rejected, cancelled, negotiating]
            example: pending
        - $ref: '../components/parameters.yaml#/parameters/PageNumber'
        - $ref: '../components/parameters.yaml#/parameters/PageSize'
      responses:
        '200':
          description: Collaboration requests retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration requests retrieved successfully
                  data:
                    type: object
                    properties:
                      requests:
                        type: array
                        items:
                          type: object
                      pagination:
                        $ref: '../components/schemas.yaml#/schemas/Pagination'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/requests/mine/sent:
    get:
      tags:
        - Collaborations
      summary: Get my sent collaboration requests (Owner)
      description: Returns all collaboration requests sent by the authenticated owner
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../components/parameters.yaml#/parameters/PageNumber'
        - $ref: '../components/parameters.yaml#/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: Filter by request status
          schema:
            type: string
            example: pending
      responses:
        '200':
          description: Sent requests retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Sent requests retrieved successfully
                  data:
                    type: object
                    properties:
                      requests:
                        type: array
                        items:
                          type: object
                      pagination:
                        $ref: '../components/schemas.yaml#/schemas/Pagination'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/requests/mine/received:
    get:
      tags:
        - Collaborations
      summary: Get my received collaboration requests (Influencer)
      description: Returns all collaboration requests received by the authenticated influencer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../components/parameters.yaml#/parameters/PageNumber'
        - $ref: '../components/parameters.yaml#/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: Filter by request status
          schema:
            type: string
            example: pending
      responses:
        '200':
          description: Received requests retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Received requests retrieved successfully
                  data:
                    type: object
                    properties:
                      requests:
                        type: array
                        items:
                          type: object
                      pagination:
                        $ref: '../components/schemas.yaml#/schemas/Pagination'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/requests/{id}:
    get:
      tags:
        - Collaborations
      summary: Get collaboration request by ID
      description: Returns details of a specific collaboration request
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Collaboration request ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Collaboration request retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration request retrieved successfully
                  data:
                    type: object
                    properties:
                      request:
                        type: object
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/requests/{id}/respond:
    patch:
      tags:
        - Collaborations
      summary: Respond to a collaboration request
      description: Influencer can accept, reject, or counter. Owner can respond during negotiation.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Collaboration request ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [accept, reject, counter]
                  example: accept
                counterBudget:
                  type: number
                  example: 750.00
                  description: Required when action is 'counter'
                message:
                  type: string
                  example: "I'd be happy to accept this collaboration"
      responses:
        '200':
          description: Response submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Response submitted successfully
                  data:
                    type: object
        '400':
          $ref: '../components/responses.yaml#/responses/BadRequestError'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/requests/{id}/cancel:
    patch:
      tags:
        - Collaborations
      summary: Cancel a collaboration request (Owner)
      description: Allows owner to cancel a pending collaboration request
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Collaboration request ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Collaboration request cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration request cancelled successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/mine/owner:
