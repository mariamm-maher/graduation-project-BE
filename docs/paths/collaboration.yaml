  /api/collaborations/{collaborationId}/tasks:
    get:
      tags:
        - Collaborations
      summary: Get tasks for a collaboration
      description: Retrieve all tasks (board view) for a specific collaboration
      security:
        - bearerAuth: []
      parameters:
        - name: collaborationId
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
        - name: status
          in: query
          required: false
          description: Filter tasks by status
          schema:
            type: string
            enum: [todo, in_progress, in_review, completed]
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Tasks retrieved successfully
                  data:
                    type: object
                    properties:
                      tasks:
                        type: array
                        items:
                          type: object
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/tasks/{id}:
    get:
      tags:
        - Collaborations
      summary: Get task by ID
      description: Retrieve details of a specific collaboration task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Task retrieved successfully
                  data:
                    type: object
                    properties:
                      task:
                        type: object
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

    patch:
      tags:
        - Collaborations
      summary: Update a task
      description: Update task details such as title, description, or due date
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Create Instagram post"
                description:
                  type: string
                  example: "Design and publish Instagram post about product launch"
                dueDate:
                  type: string
                  format: date
                  example: "2026-04-15"
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
