paths:

  /api/collaborations/overview:
    get:
      tags:
        - Collaborations
      summary: Get collaboration overview for current user
      description: Returns aggregate collaboration counts for the authenticated user (as owner or influencer).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Collaboration overview retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration overview
                  data:
                    type: object
                    properties:
                      overview:
                        type: object
                        properties:
                          totalCollaborations:
                            type: integer
                            example: 12
                          liveCollab:
                            type: integer
                            example: 3
                          completedCollabs:
                            type: integer
                            example: 4
                          pending_contract_signCollab:
                            type: integer
                            example: 2
                          in_progressCollab:
                            type: integer
                            example: 2
                          cancelledCollab:
                            type: integer
                            example: 1
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'
 
  /api/collaborations/mine/owner:
    get:
      tags:
        - Collaborations
      summary: Get my collaborations as owner
      description: Returns all collaborations where the authenticated user is the owner
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../components/parameters.yaml#/parameters/PageNumber'
        - $ref: '../components/parameters.yaml#/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: Filter by collaboration status
          schema:
            type: string
            example: active
      responses:
        '200':
          description: Owner collaborations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Owner collaborations retrieved successfully
                  data:
                    type: object
                    properties:
                      collaborations:
                        type: array
                        items:
                          type: object
                      pagination:
                        $ref: '../components/schemas.yaml#/schemas/Pagination'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/mine/influencer:
    get:
      tags:
        - Collaborations
      summary: Get my collaborations as influencer
      description: Returns all collaborations where the authenticated user is the influencer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../components/parameters.yaml#/parameters/PageNumber'
        - $ref: '../components/parameters.yaml#/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: Filter by collaboration status
          schema:
            type: string
            example: active
      responses:
        '200':
          description: Influencer collaborations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Influencer collaborations retrieved successfully
                  data:
                    type: object
                    properties:
                      collaborations:
                        type: array
                        items:
                          type: object
                      pagination:
                        $ref: '../components/schemas.yaml#/schemas/Pagination'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/{id}:
    get:
      tags:
        - Collaborations
      summary: Get collaboration by ID
      description: Returns details of a specific collaboration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Collaboration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration retrieved successfully
                  data:
                    type: object
                    properties:
                      collaboration:
                        type: object
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/{id}/cancel:
    patch:
      tags:
        - Collaborations
      summary: Cancel a collaboration
      description: Cancel an existing collaboration. Either party may cancel where permitted.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Collaboration cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration cancelled successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/{id}/complete:
    patch:
      tags:
        - Collaborations
      summary: Mark collaboration as complete
      description: Mark a collaboration as complete when all deliverables and payments are fulfilled.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Collaboration ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Collaboration marked complete successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Collaboration marked complete successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'
