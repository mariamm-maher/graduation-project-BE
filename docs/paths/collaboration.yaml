      summary: Send contract for signature
      description: Send the contract to the other party for review and signature
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Contract ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Contract sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Contract sent successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          $ref: '../components/responses.yaml#/responses/InternalServerError'

  /api/collaborations/contracts/{id}/sign:
    patch:
      tags:
        - Collaborations
      summary: Sign a contract
      description: Sign the contract to accept its terms
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Contract ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Contract signed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Contract signed successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../components/responses.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
