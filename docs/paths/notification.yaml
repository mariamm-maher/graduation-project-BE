paths:
  /api/notifications:
    get:
      tags:
        - Notifications
      summary: Get all user notifications (paginated)
      description: Returns a paginated list of notifications belonging to the authenticated user, sorted by creation date (newest first).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../components/parameters.yaml#/parameters/PageNumber'
        - $ref: '../components/parameters.yaml#/parameters/PageSize'
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Notifications retrieved successfully
                  data:
                    type: object
                    properties:
                      notifications:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            message:
                              type: string
                              example: "Your campaign has been approved"
                            type:
                              type: string
                              enum: [info, warning, error]
                              example: info
                            isRead:
                              type: boolean
                              example: false
                            category:
                              type: string
                              enum: [collaboration, task, offer, campaign, message, system]
                              nullable: true
                              example: campaign
                            actionUrl:
                              type: string
                              nullable: true
                              example: "/campaigns/123"
                            createdAt:
                              type: string
                              format: date-time
                              example: "2025-02-20T14:30:00Z"
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                            example: 45
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 10
                          totalPages:
                            type: integer
                            example: 5
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/schemas/Error'

  /api/notifications/unread:
    get:
      tags:
        - Notifications
      summary: Get unread notifications count
      description: Returns only the count of unread notifications for the current authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Unread count retrieved successfully
                  data:
                    type: object
                    properties:
                      unread:
                        type: integer
                        example: 7
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/schemas/Error'

  /api/notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Mark a single notification as read
      description: Marks the specified notification as read (only if it belongs to the authenticated user).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the notification to mark as read
          schema:
            type: integer
      responses:
        '200':
          description: Notification marked as read successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Notification marked as read
                  data:
                    type: object
                    properties:
                      notification:
                        type: object
                        properties:
                          id: { type: integer }
                          isRead: { type: boolean, example: true }
        '400':
          description: Invalid notification ID
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/schemas/Error'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/schemas/Error'

  /api/notifications/read-all:
    patch:
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: Marks **all** unread notifications of the authenticated user as read in one request.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: All notifications marked as read
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/schemas/Error'

  /api/notifications/{id}:
    delete:
      tags:
        - Notifications
      summary: Delete a notification
      description: Permanently deletes a specific notification (only if it belongs to the authenticated user).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the notification to delete
          schema:
            type: integer
      responses:
        '200':
          description: Notification deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Notification deleted successfully
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '404':
          $ref: '../components/responses.yaml#/responses/NotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/schemas/Error'

# ==============================================================================
# WebSocket Events Documentation (for reference only - not actual REST endpoints)
# ==============================================================================
# These events are handled via Socket.io WebSocket connection, not HTTP REST API
# Connect to the WebSocket server using Socket.io client library
# Server URL: Same as REST API base URL but with Socket.io protocol
#
# Connection Authentication:
#   - Send JWT access token via query parameter: ?token=<JWT_TOKEN>
#   - Or via auth object: { auth: { token: '<JWT_TOKEN>' } }
#   - Connection will be rejected if token is invalid or expired
#
# Notification Events:
#   Client -> Server:
#     - 'subscribe_notifications': Subscribe to personal notification channel
#       Parameters: None (uses authenticated user's ID)
#       Response: Confirmation message
#       Description: Automatically joins room 'user:<userId>' to receive notifications
#     
#     - 'mark_notification_read': { notificationId: number }
#       Parameters: { notificationId: number }
#       Response: { success: true }
#       Description: Marks a single notification as read
#     
#     - 'mark_all_notifications_read': No parameters
#       Parameters: None
#       Response: { success: true }
#       Description: Marks all user's notifications as read
#   
#   Server -> Client:
#     - 'new_notification': { notification: Notification }
#       Sent when: A new notification is created for the user
#       Payload: { notification: Notification object }
#       Description: Real-time notification delivery to user's personal room
#     
#     - 'notification_read': { notificationId: number }
#       Sent when: A notification is marked as read
#       Payload: { notificationId: number }
#       Description: Confirms notification was marked as read
#     
#     - 'all_notifications_read': { userId: number }
#       Sent when: All notifications are marked as read
#       Payload: { userId: number }
#       Description: Confirms all notifications were marked as read
#
# Connection Events:
#   - 'connect': Fired when connection is established
#   - 'disconnect': Fired when connection is closed
#   - 'connect_error': Fired when connection fails
#
# Error Events:
#   Server -> Client:
#     - 'error': { message: string, code?: string }
#       Sent when: An error occurs during event handling
#       Payload: { message: string, code?: string }
#
# Example Client Usage (JavaScript):
#   const socket = io('http://localhost:5000', {
#     auth: { token: 'your-jwt-token' }
#   });
#   
#   socket.on('connect', () => {
#     console.log('Connected to WebSocket server');
#     socket.emit('subscribe_notifications');
#   });
#   
#   socket.on('new_notification', (data) => {
#     console.log('New notification received:', data.notification);
#     // Display toast/notification in UI
#   });
#   
#   socket.emit('mark_notification_read', { notificationId: 123 });
#
# Example Client Usage (TypeScript with React):
#   import { io, Socket } from 'socket.io-client';
#   
#   const socket: Socket = io('http://localhost:5000', {
#     auth: { token: localStorage.getItem('accessToken') }
#   });
#   
#   useEffect(() => {
#     socket.on('new_notification', (data) => {
#       setNotifications(prev => [data.notification, ...prev]);
#       toast.success(data.notification.message);
#     });
#     
#     return () => {
#       socket.off('new_notification');
#     };
#   }, []);
