paths:
  /api/upload:
    post:
      tags:
        - Upload
      summary: Upload image to Cloudinary
      description: |
        Uploads a single image file to Cloudinary and returns the hosted URL.
        Use the optional `type` query parameter to route the image to the correct folder:
        - `avatar` → `avatars/`
        - `brandLogo` → `brand-logos/`
        - `campaignAsset` → `campaign-assets/`
        - *(omit)* → `general/`

        **Constraints:**
        - Field name must be `file`
        - Max file size: 5 MB
        - Allowed types: PNG, JPEG, JPG, WEBP
      security: []
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [avatar, brandLogo, campaignAsset]
          description: Upload destination type (controls Cloudinary folder)
          example: avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (PNG, JPEG, JPG, WEBP — max 5 MB)
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Image uploaded successfully
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      url:
                        type: string
                        format: uri
                        description: Cloudinary hosted image URL (https)
                        example: "https://res.cloudinary.com/your-cloud/image/upload/v1234567890/avatars/abc123.webp"
                      publicId:
                        type: string
                        description: Cloudinary public_id for future deletion or transformation
                        example: "avatars/abc123"
        '400':
          description: |
            Invalid request. Possible reasons:
            - No file uploaded
            - File type not allowed (only PNG, JPEG, JPG, WEBP)
            - File exceeds 5 MB limit
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/schemas/Error'
        '401':
          $ref: '../components/responses.yaml#/responses/UnauthorizedError'
        '500':
          description: Cloudinary upload failed
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/schemas/Error'

